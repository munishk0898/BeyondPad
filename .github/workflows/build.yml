name: Build APKs

on:
  push:
    branches-ignore: [ci-output]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform 36 (runner's preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools

      - name: Build debug and release
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease lintDebug 2>&1 | tee build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.txt out/ 2>/dev/null || true
          BT=$ANDROID_HOME/build-tools/36.0.0
          cp $BT/lib/apksigner.jar out/ 2>/dev/null || true
          for f in out/*.apk; do
            [ -f "$f" ] || continue
            echo "== $f" >> out/verify.txt
            $BT/aapt2 dump badging "$f" | head -6 >> out/verify.txt
            $BT/zipalign -c -P 16 -v 4 "$f" | tail -1 >> out/verify.txt || true
            $BT/apksigner verify --print-certs "$f" >> out/verify.txt 2>&1 || true
          done
          echo "status=${{ steps.build.outcome }} sha=${GITHUB_SHA}" > out/STATUS

      - name: Publish outputs to ci-output branch
        if: always()
        run: |
          cd out
          git init -q -b ci-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BeyondPad-apks
          path: out/
